<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova — Starter Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body><div class="settings">
  <button id="settings-button" type="button" aria-controls="settings-panel" aria-expanded="false">⚙ Settings</button>

  <div id="settings-panel" class="settings-panel" hidden>
   <div class="setting-row">
  <button id="invert-pixel" type="button" role="switch" aria-checked="false" aria-label="Invert Pixel">
    <span class="toggle-knob" aria-hidden="true"></span>
  </button>
  <span>Invert Pixel</span>
</div>

    <label for="speed">Speed <output id="speed-value" for="speed">250 ms</output></label>
    <input id="speed" type="range" min="25" max="1000" step="1" value="250">

    <label for="pixel-size">Pixel Size <output id="pixel-size-value" for="pixel-size">255</output></label>
<input id="pixel-size" type="range" min="50" max="500" step="1" value="255">
<p id="zoom-info">ⓘ Click or select window to zoom</p>
  </div>
</div>
    <form id="coordinate-form" class="coordinate-form">
      <div class="coordinate-fields">
        <label for="fname">
          Right Ascension
          <input
            type="text"
            id="fname"
            name="fname"
            placeholder="133.79° or 08:55:10.8"
            autocomplete="off"
            required
          />
          <span>Degrees or hours (h:m:s)</span>
        </label>
        <label for="lname">
          Declination
          <input
            type="text"
            id="lname"
            name="lname"
            placeholder="-7.245° or -07:14:42"
            autocomplete="off"
            required
          />
          <span>Degrees (decimal or d:m:s)</span>
        </label>
      </div>

      <section class="celestial-globe-panel" aria-labelledby="globe-heading">
        <h1 id="globe-heading">Celestial pointing</h1>
        <canvas
          id="coordinate-globe"
          width="560"
          height="360"
          role="img"
          aria-label="Transparent celestial sphere with equator, ecliptic, equinoxes, and selected direction"
        ></canvas>
        <p class="globe-legend">Blue: celestial equator · Gold: ecliptic and equinoxes · Cyan: target</p>
        <p id="globe-status" aria-live="polite">Enter coordinates to point the globe.</p>
      </section>

      <input type="submit" value="Submit" />
      <img
        id="result-image"
        alt="Astronomy preview"
        width="500"
        height="333"
        draggable="false"
      />
    </form>

<div id="zoom-selection" hidden></div>
<dialog id="zoom-dialog" aria-label="Zoomed image">
  <button id="zoom-close" type="button" aria-label="Close zoom">×</button>
  <canvas id="zoom-canvas" role="img" aria-label="Zoomed image selection"></canvas>
</dialog>
</body>
</html>
